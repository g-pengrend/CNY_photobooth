<!-- Clothes Style Selection Screen -->
<div id="clothes-screen" class="screen">
    <div class="content-wrapper">
        <div class="options-container">
            <h2 class="screen-title">Choose Your Outfit 👔</h2>
            <p class="options-subtitle">Select your preferred style</p>

            <div class="selection-grid clothes-grid">
                <!-- Male Options -->
                <button class="selection-card"
                    data-clothes="An oversized red denim jacket with gold-thread dragon embroidery on the back, worn over a black silk turtleneck.">
                    <span class="category-badge male">Male</span>
                    <div class="card-title">Modern Imperial Streetwear</div>
                    <div class="card-description">Red denim with gold dragon embroidery</div>
                </button>

                <button class="selection-card"
                    data-clothes="A sleek, slate-grey suit with a crimson mandarin collar and hidden frog-button closures for a sharp, CEO look.">
                    <span class="category-badge male">Male</span>
                    <div class="card-title">Minimalist Mandarin Suit</div>
                    <div class="card-description">Grey suit with crimson collar</div>
                </button>

                <button class="selection-card"
                    data-clothes="A reversible silk bomber jacket featuring one side in deep vermillion with gold crane patterns and the other in matte black.">
                    <span class="category-badge male">Male</span>
                    <div class="card-title">Ornate Silk Bomber</div>
                    <div class="card-description">Reversible silk with crane patterns</div>
                </button>

                <button class="selection-card"
                    data-clothes="A cropped red tactical vest layered over a long, flowing white linen shirt with wide sleeves and gold cuff-links.">
                    <span class="category-badge male">Male</span>
                    <div class="card-title">Layered Hanfu-Tech</div>
                    <div class="card-description">Tactical vest over flowing shirt</div>
                </button>

                <!-- Female Options -->
                <button class="selection-card"
                    data-clothes="A sleeveless, high-slit mini dress in metallic gold brocade with a sheer red organza overlay.">
                    <span class="category-badge female">Female</span>
                    <div class="card-title">Avant-Garde Qipao</div>
                    <div class="card-description">Gold brocade with red overlay</div>
                </button>

                <button class="selection-card"
                    data-clothes="A vibrant red double-breasted blazer with gold-dipped buttons and matching wide-leg trousers.">
                    <span class="category-badge female">Female</span>
                    <div class="card-title">Silken Power Suit</div>
                    <div class="card-description">Red blazer with gold buttons</div>
                </button>

                <button class="selection-card"
                    data-clothes="A white Victorian-style blouse with a high ruffled neck, paired with a high-waisted red silk corset belt and skirt.">
                    <span class="category-badge female">Female</span>
                    <div class="card-title">Ruffled Festive Chic</div>
                    <div class="card-description">Victorian blouse with corset</div>
                </button>

                <button class="selection-card"
                    data-clothes="A short, structured shoulder cape in crimson velvet with gold floral embroidery, worn over a simple sleek black dress.">
                    <span class="category-badge female">Female</span>
                    <div class="card-title">Embroidered Capelet</div>
                    <div class="card-description">Crimson cape over black dress</div>
                </button>

                <!-- Unisex Options -->
                <button class="selection-card"
                    data-clothes="A multi-layered, loose-fitting robe in off-white linen with a wide crimson sash and a light silk outer-cape featuring faint, iridescent dragon scales.">
                    <span class="category-badge unisex">Unisex</span>
                    <div class="card-title">The Celestial Traveler</div>
                    <div class="card-description">Layered robe with dragon scales</div>
                </button>

                <button class="selection-card"
                    data-clothes="A structured, high-collared vest in deep cinnabar red worn over a flowing, wide-sleeved silk shirt with embroidered golden clouds at the hem.">
                    <span class="category-badge unisex">Unisex</span>
                    <div class="card-title">Scholar's Brocade</div>
                    <div class="card-description">Red vest with cloud embroidery</div>
                </button>

                <button class="selection-card"
                    data-clothes="A hybrid of leather and silk; a short-sleeved vermillion tunic with gold-plated pauldrons (shoulder guards) etched with phoenix motifs.">
                    <span class="category-badge unisex">Unisex</span>
                    <div class="card-title">The Mythic Guardian</div>
                    <div class="card-description">Tunic with phoenix pauldrons</div>
                </button>

                <button class="selection-card"
                    data-clothes="An oversized, asymmetrical wrap-around coat in heavy red silk with black calligraphy-style brushstrokes and a high, stiffened collar.">
                    <span class="category-badge unisex">Unisex</span>
                    <div class="card-title">Monochrome Zen Flow</div>
                    <div class="card-description">Red silk with calligraphy</div>
                </button>
            </div>

            <button id="back-to-pose-btn" class="btn btn-secondary">
                <span class="btn-text">Back</span>
            </button>
        </div>
    </div>
</div>

<!-- Background Selection Screen -->
<div id="background-screen" class="screen">
    <div class="content-wrapper">
        <div class="options-container">
            <h2 class="screen-title">Choose Your Setting 🏮</h2>
            <p class="options-subtitle">Select your preferred background</p>

            <div class="selection-grid background-grid">
                <button class="selection-card"
                    data-background="A misty mountain summit at dawn, with the silhouette of a massive, glowing celestial dragon weaving through ancient, gnarled pine trees.">
                    <div class="card-title">The Dragon's Peak</div>
                    <div class="card-description">Misty mountain with celestial dragon</div>
                </button>

                <button class="selection-card"
                    data-background="An ancient courtyard where thousands of lanterns don't hang, but float magically at different heights, casting a warm, flickering amber glow on stone pillars.">
                    <div class="card-title">The Floating Lantern Sea</div>
                    <div class="card-description">Floating lanterns in courtyard</div>
                </button>

                <button class="selection-card"
                    data-background="A grand, open-air wooden pavilion with intricate red lattice-work, surrounded by swirling embers and feathers that glow with a soft orange light.">
                    <div class="card-title">The Phoenix Pavilion</div>
                    <div class="card-description">Wooden pavilion with glowing embers</div>
                </button>

                <button class="selection-card"
                    data-background="Emerald-green bamboo stalks wrapped in glowing red silk ribbons, with a mystical ground-level fog and floating spirit fire orbs.">
                    <div class="card-title">The Enchanted Bamboo Grove</div>
                    <div class="card-description">Bamboo with glowing ribbons</div>
                </button>

                <button class="selection-card"
                    data-background="A courtyard featuring a frozen, crystalline koi pond and trees with leaves made of thin, translucent gold foil that chime in the wind.">
                    <div class="card-title">The Jade Emperor's Garden</div>
                    <div class="card-description">Crystalline pond with gold-leaf trees</div>
                </button>

                <button class="selection-card"
                    data-background="A massive, weathered stone Pailou (archway) etched with glowing blue runes, standing against a deep red sky with two moons.">
                    <div class="card-title">The Celestial Gate</div>
                    <div class="card-description">Stone archway with glowing runes</div>
                </button>

                <button class="selection-card"
                    data-background="A background that looks like a 3D version of an ancient Shanshui painting—flowing waterfalls and jagged cliffs rendered in charcoal black and vivid red.">
                    <div class="card-title">The Ink-Wash Realm</div>
                    <div class="card-description">3D Shanshui painting style</div>
                </button>

                <button class="selection-card"
                    data-background="A desert night setting with a massive, shimmering red silk tent and ancient stone ruins partially buried in golden sand that glows.">
                    <div class="card-title">The Silk Road Mirage</div>
                    <div class="card-description">Desert with glowing silk tent</div>
                </button>

                <button class="selection-card"
                    data-background="An interior with towering red lacquer columns wrapped in golden bronze dragons, with floor-to-ceiling silk banners gently swaying.">
                    <div class="card-title">The Vermillion Palace Hall</div>
                    <div class="card-description">Palace with dragon columns</div>
                </button>

                <button class="selection-card"
                    data-background="A massive, ancient ginkgo tree with glowing yellow leaves, surrounded by stone statues of zodiac animals that emit a soft, protective light.">
                    <div class="card-title">The Spirit Tree Plaza</div>
                    <div class="card-description">Ginkgo tree with zodiac statues</div>
                </button>
            </div>

            <button id="back-to-clothes-btn" class="btn btn-secondary">
                <span class="btn-text">Back</span>
            </button>
        </div>
    </div>
</div>
