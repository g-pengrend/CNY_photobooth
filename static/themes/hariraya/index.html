<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari Raya Aidilfitri — Virtual Try-On</title>
    <meta name="description" content="Celebrate Hari Raya with our AI-powered virtual try-on experience">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f0a;
            --green-primary: #38a169;
            --green-light: #68d391;
            --green-dark: #276749;
            --gold-primary: #d69e2e;
            --gold-light: #ecc94b;
            --text-primary: #f0f5f0;
            --text-secondary: #8a9a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background pattern */
        .bg-pattern {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-pattern::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(56, 161, 105, 0.08), transparent 60%);
            top: -200px;
            right: -200px;
            animation: pulse-green 8s ease-in-out infinite;
        }

        .bg-pattern::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(214, 158, 46, 0.06), transparent 60%);
            bottom: -150px;
            left: -150px;
            animation: pulse-gold 10s ease-in-out infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes pulse-gold {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.15); }
        }

        /* Stars / geometric dots */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold-primary);
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 4s ease-in-out infinite;
        }

        .star:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .star:nth-child(2) { top: 25%; left: 85%; animation-delay: 1s; }
        .star:nth-child(3) { top: 60%; left: 20%; animation-delay: 2s; }
        .star:nth-child(4) { top: 75%; left: 70%; animation-delay: 0.5s; }
        .star:nth-child(5) { top: 40%; left: 90%; animation-delay: 1.5s; }
        .star:nth-child(6) { top: 85%; left: 45%; animation-delay: 3s; }
        .star:nth-child(7) { top: 10%; left: 55%; animation-delay: 2.5s; }
        .star:nth-child(8) { top: 50%; left: 5%; animation-delay: 0.8s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px;
            max-width: 600px;
        }

        .crescent-icon {
            font-size: 5rem;
            margin-bottom: 24px;
            display: inline-block;
            animation: gentle-rock 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(214, 158, 46, 0.3));
        }

        @keyframes gentle-rock {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .highlight {
            background: linear-gradient(135deg, var(--green-light), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .arabic-text {
            font-size: 1.4rem;
            color: var(--gold-primary);
            margin: 12px 0 24px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(214, 158, 46, 0.1);
            border: 1px solid rgba(214, 158, 46, 0.2);
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gold-light);
            margin-bottom: 28px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-primary);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            gap: 12px;
        }

        .back-link svg {
            transition: transform 0.3s ease;
        }

        .back-link:hover svg {
            transform: translateX(-3px);
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>

    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <div class="container">
        <div class="crescent-icon">🌙</div>

        <h1>Hari Raya <span class="highlight">Aidilfitri</span></h1>
        <p class="arabic-text">Selamat Hari Raya</p>

        <div class="status-pill">
            <span class="status-dot"></span>
            Coming Soon
        </div>

        <p class="description">
            We're crafting a beautiful virtual try-on experience for Hari Raya.
            Try on elegant Baju Kurung, Baju Melayu, and more — all powered by AI.
            Stay tuned!
        </p>

        <a href="/" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Home
        </a>
    </div>
</body>

</html>
