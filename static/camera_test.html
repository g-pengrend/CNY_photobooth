<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        video {
            width: 100%;
            max-width: 640px;
            border: 2px solid #FFD700;
            border-radius: 10px;
            margin: 20px 0;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #DC143C;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: #8B0000;
        }

        #status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            background: #333;
        }

        .error {
            background: #8B0000 !important;
        }

        .success {
            background: #006400 !important;
        }

        #devices {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>🎥 Camera Diagnostic Test</h1>

    <div id="status">Status: Ready to test</div>

    <button onclick="listDevices()">1. List Available Cameras</button>
    <button onclick="testCamera()">2. Test Camera Access</button>
    <button onclick="stopCamera()">3. Stop Camera</button>

    <div id="devices"></div>

    <video id="video" autoplay playsinline></video>

    <script>
        let stream = null;

        async function listDevices() {
            const statusDiv = document.getElementById('status');
            const devicesDiv = document.getElementById('devices');

            try {
                // First request permission
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(track => track.stop());

                // Now enumerate devices
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                statusDiv.className = 'success';
                statusDiv.textContent = `Found ${videoDevices.length} camera(s)`;

                devicesDiv.innerHTML = '<h3>Available Cameras:</h3>';
                videoDevices.forEach((device, index) => {
                    devicesDiv.innerHTML += `<p><strong>Camera ${index + 1}:</strong> ${device.label || 'Unknown Camera'}<br>ID: ${device.deviceId}</p>`;
                });

            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `<strong>Error:</strong> ${error.name}<br>${error.message}`;
                console.error('Error listing devices:', error);
            }
        }

        async function testCamera() {
            const statusDiv = document.getElementById('status');
            const video = document.getElementById('video');

            try {
                statusDiv.textContent = 'Requesting camera access...';
                statusDiv.className = '';

                // Stop any existing stream
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                // Request camera
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;

                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();

                statusDiv.className = 'success';
                statusDiv.innerHTML = `
                    <strong>✅ Camera Working!</strong><br>
                    Camera: ${track.label}<br>
                    Resolution: ${settings.width}x${settings.height}<br>
                    Frame Rate: ${settings.frameRate} fps
                `;

                console.log('Camera settings:', settings);

            } catch (error) {
                statusDiv.className = 'error';

                let errorMsg = `<strong>❌ Camera Error:</strong><br>`;
                errorMsg += `Type: ${error.name}<br>`;
                errorMsg += `Message: ${error.message}<br><br>`;

                if (error.name === 'NotAllowedError') {
                    errorMsg += '🔒 <strong>Solution:</strong> Grant camera permission in browser settings';
                } else if (error.name === 'NotFoundError') {
                    errorMsg += '📷 <strong>Solution:</strong> No camera detected. Check if camera is connected.';
                } else if (error.name === 'NotReadableError') {
                    errorMsg += '⚠️ <strong>Solution:</strong> Camera is in use by another app. Close other apps using the camera.';
                } else if (error.name === 'OverconstrainedError') {
                    errorMsg += '⚙️ <strong>Solution:</strong> Camera doesn\'t support requested settings.';
                } else if (error.name === 'SecurityError') {
                    errorMsg += '🔐 <strong>Solution:</strong> Try using HTTPS or localhost.';
                }

                statusDiv.innerHTML = errorMsg;
                console.error('Camera error:', error);
            }
        }

        function stopCamera() {
            const statusDiv = document.getElementById('status');
            const video = document.getElementById('video');

            if (stream) {
                stream.getTracks().forEach(track => {
                    console.log('Stopping track:', track.label);
                    track.stop();
                });
                video.srcObject = null;
                stream = null;

                statusDiv.textContent = 'Camera stopped';
                statusDiv.className = '';
            } else {
                statusDiv.textContent = 'No active camera to stop';
            }
        }

        // Log browser info
        console.log('Browser:', navigator.userAgent);
        console.log('HTTPS:', window.location.protocol === 'https:');
        console.log('Localhost:', window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
    </script>
</body>

</html>
